name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          
      # 2. 安装依赖 (使用 pnpm)
      - name: Install dependencies
        run: pnpm install
        
      # 3. 构建项目 (使用 pnpm)
      - name: Build
        run: pnpm build
        
      # 4. 部署到 Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIREFLY_CUSTOM }}
          channelId: live
          projectId: firefly-custom